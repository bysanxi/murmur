name: Release

on:
  push:
    tags:
      - "v[0-9]+*"

jobs:
  release:
    permissions:
      contents: write
    # Tauri enters its signing path as soon as `APPLE_CERTIFICATE` exists in
    # the environment — even as an empty string — and then dies on
    # `security import`. So never export it here: expose only a boolean flag,
    # and put the real secrets in the env of the signed build step, which is
    # skipped entirely when no certificate is configured.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      # tauri-action refuses to run without it. Job scope so neither build
      # step can forget to declare it.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Needed for changelog generation

      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ matrix.platform }}
          targets: ${{ matrix.target }}
          tools: git-cliff

      - uses: ./.github/actions/setup-node

      - name: Generate release notes
        id: release-notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "RELEASE_NOTES<<EOF"
            if ! git-cliff --latest; then
              echo "::warning::git-cliff failed, publishing without release notes"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Import Apple Developer Certificate
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify Certificate
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_CERT == 'true'
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Apple Development")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported."

      # Two mutually exclusive steps rather than one step with a conditional
      # env: a step that is skipped never injects its env, so the unsigned
      # variant cannot leak an empty APPLE_CERTIFICATE into the Tauri build.
      - name: Build murmur (signed)
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_CERT == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
        with:
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: "murmur v__VERSION__"
          releaseBody: ${{ steps.release-notes.outputs.RELEASE_NOTES }}

      - name: Build murmur
        if: ${{ !(matrix.platform == 'macos-latest' && env.HAS_APPLE_CERT == 'true') }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: "murmur v__VERSION__"
          releaseBody: ${{ steps.release-notes.outputs.RELEASE_NOTES }}

  finalize:
    # Tauri's asset names embed the version (murmur_0.3.0_x64-setup.exe), so
    # every direct link in the README would rot on the next bump. Re-upload each
    # installer under a version-independent name once all platforms are done.
    if: ${{ !cancelled() }}
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add version-independent asset aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # This job has no checkout, so gh cannot infer the repository from
          # the working directory — it would fail with "not a git repository"
          # and, with stderr discarded, look like a missing release.
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # tauri-action creates the release from inside each matrix job, so
          # this job can start before the release exists — and before its
          # assets are visible. Poll instead of quietly doing nothing: the
          # first run reported success while creating zero aliases.
          for attempt in $(seq 1 20); do
            if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
              break
            fi
            echo "release $TAG not visible yet (attempt $attempt), waiting 15s"
            sleep 15
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Release $TAG never appeared; aliases were not created."
              exit 1
            fi
          done

          for attempt in $(seq 1 20); do
            rm -rf assets
            mkdir -p assets
            gh release download "$TAG" --repo "$REPO" --dir assets > /dev/null 2>&1 || true
            if [ -n "$(ls -A assets)" ]; then
              break
            fi
            echo "no assets visible yet (attempt $attempt), waiting 15s"
            sleep 15
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Release $TAG has no assets; aliases were not created."
              exit 1
            fi
          done

          shopt -s nullglob
          aliases=(
            "*_x64-setup.exe:murmur-windows-x64-setup.exe"
            "*_x64_en-US.msi:murmur-windows-x64.msi"
            "*aarch64.dmg:murmur-macos-aarch64.dmg"
            "*_x64.dmg:murmur-macos-x64.dmg"
            "*.AppImage:murmur-linux-x86_64.AppImage"
            "*.deb:murmur-linux-amd64.deb"
            "*.rpm:murmur-linux-x86_64.rpm"
          )
          aliased=0
          for entry in "${aliases[@]}"; do
            pattern="${entry%%:*}"
            stable_name="${entry##*:}"
            matches=(assets/$pattern)
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "::warning::No release asset matched $pattern"
              continue
            fi
            original="${matches[0]}"
            cp "$original" "assets/$stable_name"
            gh release upload "$TAG" --repo "$REPO" "assets/$stable_name" --clobber
            gh release delete-asset "$TAG" --repo "$REPO" "$(basename "$original")" --yes
            echo "aliased $(basename "$original") -> $stable_name"
            aliased=$((aliased + 1))
          done
          echo "created $aliased alias(es)"
          if [ "$aliased" -eq 0 ]; then
            echo "::error::No aliases were created for $TAG."
            exit 1
          fi
