name: Release

on:
  push:
    tags:
      - "v[0-9]+*"

jobs:
  release:
    permissions:
      contents: write
    # Job-level so the macOS steps can branch on them in their `if:` — without
    # the secrets they are empty and macOS still ships an unsigned build.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Needed for changelog generation

      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ matrix.platform }}
          targets: ${{ matrix.target }}
          tools: git-cliff

      - uses: ./.github/actions/setup-node

      - name: Generate release notes
        id: release-notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "RELEASE_NOTES<<EOF"
            if ! git-cliff --latest; then
              echo "::warning::git-cliff failed, publishing without release notes"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Import Apple Developer Certificate
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify Certificate
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Apple Development")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported."

      - name: Build murmur
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
        with:
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: "murmur v__VERSION__"
          releaseBody: ${{ steps.release-notes.outputs.RELEASE_NOTES }}

  finalize:
    # Tauri's asset names embed the version (murmur_0.3.0_x64-setup.exe), so
    # every direct link in the README would rot on the next bump. Re-upload each
    # installer under a version-independent name once all platforms are done.
    if: ${{ !cancelled() }}
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add version-independent asset aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::No release exists for $TAG, nothing to alias."
            exit 0
          fi
          mkdir -p assets
          gh release download "$TAG" --dir assets || true
          if [ -z "$(ls -A assets)" ]; then
            echo "::notice::Release $TAG has no assets yet, nothing to alias."
            exit 0
          fi
          shopt -s nullglob
          aliases=(
            "*_x64-setup.exe:murmur-windows-x64-setup.exe"
            "*_x64_en-US.msi:murmur-windows-x64.msi"
            "*aarch64.dmg:murmur-macos-aarch64.dmg"
            "*_x64.dmg:murmur-macos-x64.dmg"
            "*.AppImage:murmur-linux-x86_64.AppImage"
            "*.deb:murmur-linux-amd64.deb"
            "*.rpm:murmur-linux-x86_64.rpm"
          )
          for entry in "${aliases[@]}"; do
            pattern="${entry%%:*}"
            stable_name="${entry##*:}"
            matches=(assets/$pattern)
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "::warning::No release asset matched $pattern"
              continue
            fi
            original="${matches[0]}"
            cp "$original" "assets/$stable_name"
            gh release upload "$TAG" "assets/$stable_name" --clobber
            gh release delete-asset "$TAG" "$(basename "$original")" --yes
            echo "aliased $(basename "$original") -> $stable_name"
          done
